name: Compile

# Compiles the custom operators (ParticleCloudTOP, ParticleDensityTOP,
# ParticleSurfaceSOP) on every push / PR. The badge in README.md reflects the
# latest run of this workflow on the default branch.
#
# The TouchDesigner C++ API headers are proprietary and NOT committed here, so
# CI fetches them from Derivative's public CustomOperatorSamples repository and
# points the build at the folders containing TOP_CPlusPlusBase.h and
# SOP_CPlusPlusBase.h.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA Toolkit (12.x)
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda-toolkit
        with:
          cuda: '12.6.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Report toolchain
        shell: pwsh
        run: |
          nvcc --version
          cmake --version
          ninja --version

      - name: Fetch TouchDesigner C++ API headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TouchDesigner/CustomOperatorSamples.git tdsamples
          $hdr = Get-ChildItem -Path tdsamples -Recurse -Filter TOP_CPlusPlusBase.h |
                 Select-Object -First 1
          if (-not $hdr) { Write-Error "TOP_CPlusPlusBase.h not found in CustomOperatorSamples"; exit 1 }
          $dir = $hdr.Directory.FullName
          Write-Host "TD TOP headers at: $dir"
          "TD_INCLUDE=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sop = Get-ChildItem -Path tdsamples -Recurse -Filter SOP_CPlusPlusBase.h |
                 Select-Object -First 1
          if (-not $sop) { Write-Error "SOP_CPlusPlusBase.h not found in CustomOperatorSamples"; exit 1 }
          $sopdir = $sop.Directory.FullName
          Write-Host "TD SOP headers at: $sopdir"
          "TD_SOP_INCLUDE=$sopdir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (CMake + Ninja)
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" `
            -DTD_INCLUDE="$env:TD_INCLUDE" `
            -DTD_SOP_INCLUDE="$env:TD_SOP_INCLUDE"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Verify the DLLs were produced
        shell: pwsh
        run: |
          foreach ($name in 'ParticleCloudTOP', 'ParticleDensityTOP', 'ParticleSurfaceSOP') {
            $dll = Get-ChildItem -Path build -Recurse -Filter "$name.dll" | Select-Object -First 1
            if (-not $dll) { Write-Error "$name.dll was not built"; exit 1 }
            Write-Host "Built: $($dll.FullName)  ($([math]::Round($dll.Length/1KB)) KB)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDCuda-operators
          path: |
            build/**/ParticleCloudTOP.dll
            build/**/ParticleDensityTOP.dll
            build/**/ParticleSurfaceSOP.dll
          if-no-files-found: error
